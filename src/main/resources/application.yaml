server:
  port: 8080

spring:
  application:
    name: "accounts"
  profiles:
    active: "prod"
  config:
    import: "optional:configserver:http://localhost:8071/"
#  rabbitmq:
#    host: "localhost"
#    port: 5672
#    username: "guest"
#    password: "guest"
  datasource:
    #H2 DB URL
    url: jdbc:h2:mem:testdb
    #url: jdbc:mysql://localhost:3306/accountsDB
    # Required for H2 database to specify the driver class. Driver class is necessary for Spring Boot to know how to connect to the H2 database.
#    driverClassName: org.h2.Driver
    username: sa
    password: ''
#    driver-class-name: com.mysql.cj.jdbc.Driver
    driverClassName: org.h2.Driver
  cloud:
   openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true
  h2:
    console:
      # Enable H2 console for debugging
      enabled: true
  jpa:
    # Helpful for generating SQL queries specific to H2. This is necessary for Hibernate to understand how to interact with the H2 database.
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Automatically update the database schema based on the entity definitions. This is useful for development and testing, but should be used with caution in production environments.
      ddl-auto: update
      # Show SQL statements in the console for debugging purposes. This is helpful for developers to see the actual SQL queries being executed against the database, which can aid in troubleshooting and optimizing database interactions.
    show-sql: true
  sql:
   init:
    mode: always # This configuration ensures that the database schema is initialized every time the application starts. This is particularly useful during development and testing to ensure that the database is in a known state, but it should be used with caution in production environments to avoid unintended data loss.
# Enables refresh, busRefresh paths
management:
  endpoint:
    shutdown:
      enabled: true # This configuration enables the shutdown endpoint, which allows you to gracefully shut down the application by sending a POST request to the /actuator/shutdown endpoint. This can be useful for managing the lifecycle of the application and performing cleanup tasks before shutting down.
    health:
      probes:
        enabled: true # This configuration enables health probes, which are used by container orchestration platforms (like Kubernetes) to check the health of the application. This allows the platform to automatically restart the application if it becomes unhealthy, improving the reliability and availability of the service.
  info:
    env:
      enabled: true # This configuration enables the inclusion of environment information in the application's info endpoint. This can be useful for debugging and monitoring purposes, as it allows you to see the active profiles, property sources, and other environment details when accessing the /actuator/info endpoint.
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*" # This configuration allows all management endpoints to be exposed over the web. This is useful for monitoring and managing the application, but in a production environment, you should consider restricting access to sensitive endpoints for security reasons.

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    # Set the path for the Swagger UI. This allows developers to access the API documentation and test the endpoints through a web interface.

# Registers with Eureka server for service discovery and sends heartbeats to indicate that the service is alive and healthy. This allows other services to discover and communicate with this service through the Eureka server.
eureka:
  instance:
    preferIpAddress: true # This configuration tells the Eureka client to prefer using the IP address of the instance when registering with the Eureka server, instead of the hostname. This can be useful in certain network configurations where the hostname may not resolve correctly or when you want to ensure that the service is registered with its IP address for better connectivity.
  client:
    fetchRegistry: true # This configuration tells the Eureka client to fetch the registry information from the Eureka server. This allows the service to discover other services registered with the Eureka server and communicate with them. Setting this to true is necessary for service discovery to work properly.
    registerWithEureka: true # This configuration tells the Eureka client to register itself with the
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/ # This is the URL of the Eureka server that this service will register with. In this case, it is set to http://localhost:8070/eureka/, which means that the service will register itself with the Eureka server running on localhost at port 8070. If your Eureka server is running on a different host or port, you should update this URL accordingly.

# The "info" section is used to provide metadata about the application, such as its name, description, and version. This information can be useful for monitoring and management purposes, as it allows you to easily identify the service and its version when viewing the application's health and status in a monitoring tool or dashboard.
info:
  app:
    name: "accounts"
    description: "This service manages customer accounts and related information."
    version: "1.0.0"

# Optional for now can be ignored
endpoints:
  shutdown:
    enabled: true # This configuration enables the shutdown endpoint, which allows you to gracefully shut down the application by sending a POST request to the /actuator/shutdown endpoint. This can be useful for managing the lifecycle of the application and performing cleanup tasks before shutting down.

logging:
    level:
      com:
        financial:
          accounts:
            microservice: DEBUG # This configuration sets the logging level for the "com.financial.accounts" package to DEBUG. This means that all log messages at the DEBUG level and above (INFO, WARN, ERROR) will be logged for classes within this package. This can be useful for troubleshooting and debugging issues related to the accounts service, as it provides detailed information about the application's behavior and interactions with other components.

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10 # This configuration sets the size of the sliding window for the circuit breaker to 10, which means that the circuit breaker will consider the last 10 calls to determine whether to open or close the circuit. This can help to smooth out fluctuations in call success rates and provide a more stable behavior for the circuit breaker.
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
  retry:
    configs:
      default:
        enableExponentialBackoff: true # This configuration enables exponential backoff for retry attempts. With exponential backoff, the wait duration between retry attempts will increase exponentially (e.g., 2 seconds, 4 seconds, 8 seconds) after each failed attempt. This can help to reduce the load on the system and increase the chances of a successful retry by allowing more time for transient issues to resolve before trying again.
        exponentialBackoffMultiplier: 2 # This configuration sets the multiplier for exponential backoff to 2. This means that the wait duration between retry attempts will double after each failed attempt (e.g., 2 seconds, 4 seconds, 8 seconds). This can help to reduce the load on the system and increase the chances of a successful retry by allowing more time for transient issues to resolve before trying again.
        maxRetryAttempts: 3 # This configuration sets the maximum number of retry attempts to 3. This means that if a call fails, the system will automatically retry the call up to 3 times before giving up and returning an error. This can help to improve the resilience of the application by allowing it to recover from transient failures without requiring manual intervention.
        waitDuration: 5000 # This configuration sets the wait duration between retry attempts to 2000 milliseconds (2 seconds). This means that after a failed call, the system will wait for 2 seconds before attempting the next retry. This can help to prevent overwhelming the system with rapid retries and allows time for transient issues to resolve before trying again.
  rateLimiter:
    configs:
      default:
        limitForPeriod: 1 # This configuration sets the maximum number of calls that can be made within a specified time period to 1. This means that if more than 10 calls are made within the defined time period, subsequent calls will be rejected until the time period resets. This can help to prevent overloading the system and ensure that resources are used efficiently.
        limitRefreshPeriod: 5s # This configuration sets the refresh period for the rate limiter to 5 second. This means that the rate limiter will reset its count of calls every second, allowing up to the defined limit (e.g., 10 calls) to be made within each second. This can help to control the rate of incoming requests and prevent abuse or overloading of the system.
        timeoutDuration: 1000 # This configuration sets the timeout duration for acquiring a permit from the rate limiter to 1000 milliseconds (1 seconds). This means that if a call is made and the rate limiter is currently at its limit, the system will wait for up to 2 seconds to acquire a permit before throwing a timeout exception. This can help to prevent the system from hanging indefinitely when the rate limit is exceeded and allows for better handling of high traffic situations.